server:
  port: ${SERVER_PORT:8081}
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: hmdp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      # 压测调优：默认10偏小，高并发写链路会争抢连接（P0-2）
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:6MB}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        # 压测调优：原10偏小，读接口高并发下连接等待明显（P0-2）
        max-active: ${REDIS_POOL_MAX_ACTIVE:50}
        max-idle: ${REDIS_POOL_MAX_IDLE:50}
        min-idle: ${REDIS_POOL_MIN_IDLE:5}
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
  # 邮件发送配置（spring-boot-starter-mail），用于验证码邮箱通道
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  elasticsearch:
    rest:
      uris: ${ES_URIS:http://localhost:9200}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    listener:
      ack-mode: manual_immediate
    template:
      default-topic: ${KAFKA_DEFAULT_TOPIC:seckill-order}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:seckill-order-g1}
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:1}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: false

app:
  cache:
    shop:
      mode: ${SHOP_CACHE_MODE:local-redis}
  security:
    # 逗号分隔的管理员用户 ID；空配置时后台接口默认拒绝访问
    admin-user-ids: ${ADMIN_USER_IDS:}
  # 登录验证码配置：通道(log/email) 与频控阈值
  verify-code:
    channel: ${VERIFY_CODE_CHANNEL:log}
    resend-interval-seconds: ${VERIFY_CODE_RESEND_INTERVAL:60}
    max-per-target-per-day: ${VERIFY_CODE_MAX_PER_TARGET:10}
    max-per-ip-per-day: ${VERIFY_CODE_MAX_PER_IP:20}
    max-verify-attempts: ${VERIFY_CODE_MAX_ATTEMPTS:5}
  # 邮件发件配置（channel=email 时必填：username + password 的 SMTP 授权码）
  mail:
    from: ${MAIL_FROM:}
  upload:
    dir: ${UPLOAD_DIR:./uploads/imgs/}
    max-size-mb: ${UPLOAD_MAX_SIZE_MB:5}
    allowed-extensions: jpg,jpeg,png,webp
  kafka:
    relay:
      consumer-name: ${KAFKA_RELAY_CONSUMER_NAME:}
      batch-size: ${KAFKA_RELAY_BATCH_SIZE:100}
      block-timeout-ms: ${KAFKA_RELAY_BLOCK_TIMEOUT_MS:2000}
    consumer:
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:${spring.kafka.consumer.concurrency:1}}
      fail-once: false
      fail-always: false
      fail-voucher-id: -1
    fail-task:
      auto-retry-enabled: true
      retry-interval-ms: 15000
      batch-size: 20
      max-retry-count: 5
    monitor:
      enabled: true
      lag-threshold: 500
      interval-ms: 60000
  seckill:
    mode: ${SECKILL_MODE:redis-stream-kafka}
    redis-stream:
      consumer-name: ${REDIS_STREAM_CONSUMER_NAME:}
    reconcile:
      enabled: true
      interval-ms: 300000

# Canal配置
canal:
  enabled: ${CANAL_ENABLED:false}
  host: ${CANAL_HOST:localhost}
  port: ${CANAL_PORT:11111}
  destination: ${CANAL_DESTINATION:example}
  batch-size: ${CANAL_BATCH_SIZE:100}

mybatis-plus:
  type-aliases-package: com.hmdp.entity

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hmdp: info
  pattern:
    dateformat: mm:ss.SSS
  file:
    name: app.log

# AI配置
ai:
  enabled: true
  base-url: ${AI_BASE_URL:https://api.openai.com}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-3.5-turbo}
  temperature: 0.7
  max-tokens: 1000
  timeout: 30000

  retry:
    max-attempts: 3
    initial-delay-ms: 1000

  security:
    sensitive-words: ${AI_SENSITIVE_WORDS:政治,暴力,色情,赌博,毒品}
    prompt-injection-protection: true

  chat:
    max-history: 10
    session-timeout: 3600
    max-message-length: 500

  knowledge:
    retrieval-method: keyword
