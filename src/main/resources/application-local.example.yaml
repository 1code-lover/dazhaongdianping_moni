spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: your-db-username
    password: your-db-password
  redis:
    host: 127.0.0.1
    port: 6379
    password: your-redis-password
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    template:
      default-topic: seckill-order
    consumer:
      group-id: seckill-order-g1

server:
  port: 8081

app:
  security:
    # 通过 ADMIN_USER_IDS 配置逗号分隔的管理员用户 ID；空值会默认拒绝后台访问
    admin-user-ids: ${ADMIN_USER_IDS:}
  upload:
    dir: ${UPLOAD_DIR:./uploads/imgs/}
    max-size-mb: ${UPLOAD_MAX_SIZE_MB:5}
    allowed-extensions: jpg,jpeg,png,webp
